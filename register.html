<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | The Photographic Society</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Camera logo">
            <span>The Photographic Society</span>
        </a>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="register.html" class="active">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title page-title-register">Registration Form</h1>
        <section class="register-section">

            <form id="register-form">
                <div class="field">
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" name="fullName" required>
                </div>

                <div class="field">
                    <label for="dob">Date of birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Choose your league</legend>
                    <label class="option"><input type="radio" name="league" value="Women's"
                            required><span>Women's</span></label>
                    <label class="option"><input type="radio" name="league" value="Men's"><span>Men's</span></label>
                    <label class="option"><input type="radio" name="league" value="Junior"><span>Junior</span></label>
                </fieldset>

                <fieldset>
                    <legend>Level</legend>
                    <label class="option"><input type="radio" name="level" value="Advanced"
                            required><span>Advanced</span></label>
                    <label class="option"><input type="radio" name="level"
                            value="Intermediate"><span>Intermediate</span></label>
                    <label class="option"><input type="radio" name="level"
                            value="Beginner"><span>Beginner</span></label>
                </fieldset>

                <button type="submit">Register now</button>
                <p class="form-note">Your name won’t be shared. Never submit passwords.</p>
            </form>

            <h2 class="slogan">Be Part of Something Bigger.</h2>

        </section>
    </main>

    <footer><i>©2026 The Photographic Society. All rights reserved.</i></footer>
    <script src="script.js"></script>
</body>

</html>
